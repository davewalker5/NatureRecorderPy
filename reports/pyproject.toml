[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nature-recorder-reports"
version = "1.27.0"
description = "Jupyter notebook reports for Nature Recorder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "folium>=0.20,<1",
    "ipykernel>=7,<8",
    "jupyterlab>=4.5.10,<5",
    "matplotlib>=3,<4",
    "openpyxl",
    "pandas>=3,<4",
    "papermill>=2,<3",
    "scipy>=1,<2",
    "seaborn>=0.13,<1",
    "sqlparse>=0.5,<1",
]

[tool.setuptools]
py-modules = []
